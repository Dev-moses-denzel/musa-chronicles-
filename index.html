<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Musa Chronicles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-viewport">
        <!-- Modern Gaming Home Screen Layout Overlay -->
        <div id="main-menu-screen">
            <div class="menu-brand-title">MUSA CHRONICLES</div>
            <div class="menu-subtitle">THE GOLDEN SCAR LEGACY</div>
            <div class="menu-action-cluster">
                <button id="initiate-btn" class="menu-start-btn">✨ INITIATE STORY</button>
                <button id="load-btn" class="menu-start-btn">📂 LOAD FILES</button>
            </div>
        </div>

        <div id="flash-overlay"></div>
        
        <div id="hud-layer">
            <div class="hud-card">SURVIVAL: <span id="stat-survival">100</span>%</div>
            <div class="hud-card">PATH: <span id="stat-alignment">NEUTRAL</span></div>
            <div id="hud-menu-btn" class="hud-card" style="cursor: pointer;">💾 MENU</div>
        </div>

        <div id="save-menu-overlay">
            <div class="menu-box">
                <h3>SYSTEM LOGS</h3>
                <button id="quick-save-btn" class="menu-btn">💾 QUICK SAVE PROGRESS</button>
                <button id="quick-load-btn" class="menu-btn">📂 LOAD LAST SAVE</button>
                <button id="restart-btn" class="menu-btn reset-btn">🔄 RESTART NEW GAME</button>
                <button id="close-menu-btn" class="menu-btn close-btn">❌ CLOSE MENU</button>
            </div>
        </div>

        <div id="choice-deck"></div>
        <div id="dialogue-window">
            <div id="name-plate">System</div>
            <div id="story-text">Booting core narrative sequence...</div>
            <div id="advance-indicator">Tap To Proceed</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
