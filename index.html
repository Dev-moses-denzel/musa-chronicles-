<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Musa Chronicles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-viewport">
        <!-- Modern Gaming Home Screen Layout Overlay -->
        <div id="main-menu-screen">
            <div class="menu-brand-title">MUSA CHRONICLES</div>
            <div class="menu-subtitle">THE GOLDEN SCAR LEGACY</div>
            <div class="menu-action-cluster">
                <button class="menu-start-btn" onclick="startGameFromMenu()">✨ INITIATE STORY</button>
                <button class="menu-start-btn" onclick="executeLoadGame()">📂 LOAD FILES</button>
            </div>
        </div>

        <div id="flash-overlay"></div>
        
        <div id="hud-layer">
            <div class="hud-card">SURVIVAL: <span id="stat-survival">100</span>%</div>
            <div class="hud-card">PATH: <span id="stat-alignment">NEUTRAL</span></div>
            <div class="hud-card" onclick="toggleSaveMenu()" style="cursor: pointer;">💾 MENU</div>
        </div>

        <div id="save-menu-overlay" onclick="toggleSaveMenu()">
            <div class="menu-box" onclick="event.stopPropagation()">
                <h3>SYSTEM LOGS</h3>
                <button class="menu-btn" onclick="executeSaveGame()">💾 QUICK SAVE PROGRESS</button>
                <button class="menu-btn" onclick="executeLoadGame()">📂 LOAD LAST SAVE</button>
                <button class="menu-btn reset-btn" onclick="restartCycle()">🔄 RESTART NEW GAME</button>
                <button class="menu-btn close-btn" onclick="toggleSaveMenu()">❌ CLOSE MENU</button>
            </div>
        </div>

        <div id="choice-deck"></div>
        <div id="dialogue-window" onclick="triggerNext()">
            <div id="name-plate">System</div>
            <div id="story-text">Booting core narrative sequence...</div>
            <div id="advance-indicator">Tap To Proceed</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
