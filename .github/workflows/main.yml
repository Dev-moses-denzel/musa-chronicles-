name: Build Musa Chronicles APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Image Processor
        run: sudo apt-get install -y imagemagick

      - name: Auto-Crop Perfect Square Icon
        run: |
          convert apartment.png -resize 512x512^ -gravity center -extent 512x512 icon.png

      - name: Build Web App into APK
        uses: darkshredder/web-to-app-action@main
        with:
          build-folder-path: "."
          app-name: "MusaChronicles"
          output-folder-path: "output-apk"

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Musa-Chronicles-APK
          path: output-apk/*.apk
          
